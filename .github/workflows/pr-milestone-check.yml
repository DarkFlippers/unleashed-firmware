# Release-milestone guard. Anything that is actually being implemented belongs in the
# release it ships in, not in the open-ended Backlog: a PR sitting on `Backlog` (or on no
# milestone at all) drops out of the release notes and out of the milestone-per-release
# tracking. The same goes for the issues the PR closes — if code is being written for an
# issue, that issue is no longer backlog. An issue nobody is implementing may stay in
# Backlog or be closed with a reason; this check never looks at those, only at what a PR
# links via `Closes`/`Fixes`.
#
# Linked issues come from GitHub's own `closingIssuesReferences` rather than from grepping
# the description, so the check sees exactly the issues the merge will close.
#
# Security: nothing is checked out and every permission is read-only, so plain
# `pull_request` (rather than `pull_request_target`) is safe for fork PRs. Values that come
# from the event payload are bound to env vars and never interpolated into the script.
#
# `milestoned` and `demilestoned` are in the trigger list so a maintainer only has to set
# the milestone for the check to re-run; `edited` covers adding or removing a `Closes #N`.
# Changing an *issue's* milestone fires no PR event — re-run the job from the Checks tab.

name: PR milestone check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, milestoned, demilestoned]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-milestone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-milestone:
    name: Release milestone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR and linked issues are not backlog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MILESTONE: ${{ github.event.pull_request.milestone.title }}
          # Milestones that mean "not scheduled". One per line, matched case-insensitively.
          BLOCKED_MILESTONES: |
            Backlog
        run: |
          set -euo pipefail

          fail=0

          is_blocked() {
            local name
            name=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            printf '%s\n' "$BLOCKED_MILESTONES" | tr '[:upper:]' '[:lower:]' | grep -qxF "$name"
          }

          if [ -z "$PR_MILESTONE" ]; then
            echo "::error title=PR has no milestone::Assign this PR to the release milestone it ships in (unlshd-NNN). Setting the milestone re-runs this check."
            fail=1
          elif is_blocked "$PR_MILESTONE"; then
            echo "::error title=PR is on the $PR_MILESTONE milestone::A PR with an implementation is not backlog - move it to the release milestone it ships in (unlshd-NNN), or close it if it is not going in."
            fail=1
          else
            echo "PR milestone: $PR_MILESTONE - OK."
          fi

          query='
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 50) {
                  nodes {
                    number
                    milestone { title }
                    repository { nameWithOwner }
                  }
                }
              }
            }
          }'

          if ! linked=$(gh api graphql -f query="$query" \
              -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                    | [.repository.nameWithOwner, (.number | tostring), (.milestone.title // "")]
                    | @tsv' 2>&1); then
            echo "::error title=Could not read linked issues::$(printf '%s' "$linked" | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi

          if [ -z "$linked" ]; then
            echo "No linked issues (no Closes/Fixes reference) - nothing else to check."
            exit "$fail"
          fi

          while IFS=$'\t' read -r issue_repo issue_number issue_milestone; do
            [ -n "$issue_number" ] || continue

            if [ "$issue_repo" != "$REPO" ]; then
              echo "::notice title=Linked issue is in another repository::${issue_repo}#${issue_number} is not milestoned from here - skipped."
              continue
            fi

            if [ -z "$issue_milestone" ]; then
              echo "::error title=Linked issue #${issue_number} has no milestone::This PR implements #${issue_number}, so put the issue on the same release milestone as the PR (unlshd-NNN)."
              fail=1
            elif is_blocked "$issue_milestone"; then
              echo "::error title=Linked issue #${issue_number} is on the $issue_milestone milestone::#${issue_number} is being implemented by this PR, so it is no longer backlog - move it to the release milestone the PR ships in (unlshd-NNN)."
              fail=1
            else
              echo "Linked issue #${issue_number} milestone: $issue_milestone - OK."
            fi
          done <<< "$linked"

          exit "$fail"
