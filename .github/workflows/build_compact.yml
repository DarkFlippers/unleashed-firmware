name: 'Compact build'

on:
  pull_request:

env:
  DEFAULT_TARGET: f7
  # Minimum free flash below the core2 radio stack before CI fails: 2 flash pages
  # of FURI_HAL_FLASH_PAGE_SIZE (4096)
  MIN_FREE_FLASH: 8192
  FBT_TOOLCHAIN_PATH: /runner/_work
  FBT_GIT_SUBMODULE_SHALLOW: 1
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  compact:
    runs-on: [self-hosted, FlipperZeroShell]
    strategy:
      fail-fast: false
      matrix:
        target: [f7, f18]
    steps:
      - name: 'Wipe workspace'
        run: find ./ -mount -maxdepth 1 -exec rm -rf {} \;

      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Get commit details'
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            TYPE="pull"
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TYPE="tag"
          else
            TYPE="other"
          fi
          python3 scripts/get_env.py "--event_file=${{ github.event_path }}" "--type=$TYPE" || cat "${{ github.event_path }}"

      - name: 'Build the firmware'
        id: build-fw
        run: |
          set -e
          TARGET="$(echo '${{ matrix.target }}' | sed 's/f//')"; \
          ./fbt TARGET_HW=$TARGET DEBUG=0 COMPACT=1 fap_dist updater_package
          echo "sdk-file=$(ls dist/${{ matrix.target }}-*/flipper-z-${{ matrix.target }}-sdk-*.zip)" >> $GITHUB_OUTPUT
          echo "hw-target-code=$TARGET" >> $GITHUB_OUTPUT

      - name: Deploy uFBT with SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          task: setup
          sdk-file: ${{ steps.build-fw.outputs.sdk-file }}
          sdk-hw-target: ${{ steps.build-fw.outputs.hw-target-code }}

      - name: Build test app with SDK
        run: |
          mkdir testapp
          cd testapp
          ufbt create APPID=testapp
          ufbt

      - name: Build example & external apps with uFBT
        run: |
          for appdir in 'applications/examples'; do
            for app in $(find "$appdir" -maxdepth 1 -mindepth 1 -type d); do
              pushd $app
              TARGETS_FAM=$(grep "targets" application.fam || echo "${{ matrix.target }}")
              if ! grep -q "${{ matrix.target }}" <<< $TARGETS_FAM ; then
                  echo Skipping unsupported app: $app
                  popd
                  continue
              fi
              echo Building $app
              ufbt
              popd
            done
          done

      - name: 'Check free flash space'
        id: size
        if: ${{ matrix.target == env.DEFAULT_TARGET }}
        run: |
          source scripts/toolchain/fbtenv.sh
          python3 scripts/fwsize.py free build/${{ matrix.target }}-firmware-*/firmware.elf --label release

      - name: 'Fail on low free flash'
        if: ${{ steps.size.outputs.free_flash }}
        env:
          FREE_FLASH: ${{ steps.size.outputs.free_flash }}
        run: |
          if [ "$FREE_FLASH" -lt "$MIN_FREE_FLASH" ]; then
            if [ "$FREE_FLASH" -le 0 ]; then
              echo "::error::Firmware reaches into the core2 radio stack region ($FREE_FLASH bytes free), which the linker counts as .free_flash and cannot catch"
            else
              echo "::error::Only $FREE_FLASH bytes of free flash left, below the $MIN_FREE_FLASH byte minimum"
            fi
            exit 1
          fi
          echo "Free flash: $FREE_FLASH bytes (minimum $MIN_FREE_FLASH)"

      - name: 'Find previous comment'
        if: ${{ !github.event.pull_request.head.repo.fork && matrix.target == env.DEFAULT_TARGET }}
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Compact ${{ matrix.target }} firmware for commit'

      - name: 'Create or update comment'
        if: ${{ !github.event.pull_request.head.repo.fork && matrix.target == env.DEFAULT_TARGET }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Compact ${{ matrix.target }} firmware for commit `${{ env.COMMIT_SHA }}`:**
            - ${{ steps.size.outputs.size_report }}
          edit-mode: replace

