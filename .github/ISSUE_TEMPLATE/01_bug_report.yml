name: Bug report
description: File a bug report regarding the firmware.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out an issue, this template is meant for any issues related to the Flipper Zero unleashed firmware.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: "How can this bug be reproduced?"
      placeholder: |
        1. Switch on...
        2. Press button '....'
        3. Wait for the moon phase
        4. It burns
    validations:
      required: true
  - type: dropdown
    id: fw-version
    attributes:
      label: Found in version
      description: Which firmware version are you running? Check Settings → About or the boot screen.
      options:
        - unlshd-089
        - dev
    validations:
      required: true
  - type: input
    id: dev-version
    attributes:
      label: Dev version
      description: "If you selected `dev` above, paste the exact build identifier (commit hash or build date). Required for dev builds."
      placeholder: e.g. a1b2c3d or 2026-07-05
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach your debug logs here
      render: Text
      # Avoid rendering as Markdown here.
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Let us know if you have anything else to share.
